<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>本地登录 · 智能填报调试</title>
<style>
*{margin:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f5f7fa;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#2E3A59}
.c{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:28px;width:340px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-size:16px;margin-bottom:4px}
p{font-size:12px;color:#8A92A6;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:#6B7280;margin:10px 0 5px}
input{width:100%;border:1px solid #E2E8F0;border-radius:9px;padding:9px 12px;font-size:13px;outline:none}
button{width:100%;margin-top:16px;background:linear-gradient(135deg,#4A6CF7,#6B8AFF);color:#fff;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
.tip{font-size:11px;color:#B0B7C3;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<div class="c">
  <h1>本地登录（开发辅助）</h1>
  <p>调用后端 /auth/login 获取令牌写入 localStorage，供本地调试智能填报等用户态页面。</p>
  <label>用户名</label>
  <input id="u" value="admin">
  <label>密码</label>
  <input id="p" type="password" value="admin123">
  <button id="go">登录并进入 AI中台</button>
  <div class="tip">仅本地开发环境使用；生产环境走 CAS 统一认证，此页面不会被入口链接暴露。</div>
</div>
<script>
document.getElementById('go').onclick = async () => {
  const b = document.getElementById('go');
  b.disabled = true; b.textContent = '登录中…';
  try {
    const r = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }),
    });
    const j = await r.json();
    if (j.code === 200 && j.data && j.data.token) {
      localStorage.setItem('user_token', j.data.token);
      location.href = '/#/form-agent';
      return;
    }
    throw new Error(j.message || '登录失败');
  } catch (e) {
    alert(e.message);
    b.disabled = false; b.textContent = '登录并进入 AI中台';
  }
};
</script>
</body>
</html>
